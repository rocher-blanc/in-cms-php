<div class="drop-close">
	<a class="jsave" href="javascript:;"><i class="fa fa-floppy-o"></i> Sauvegarder</a>&nbsp;&nbsp;&nbsp;
	<a class="jclose" href="javascript:;"><i class="fa fa-times"></i> Fermer</a>
</div>
<form action="{{ siteUrl('module/' ~ mod.name ~ '/jgallery_cropost') }}" id="jgallery_crop_form">
	<img src="{{ siteUrl( image_src , false ) }}" alt="" title="" class="" id="cropimage" />
	<input type="hidden" id="token" name="{{csrf_key}}" value="{{csrf_token}}" />
	<input type="hidden" name="id" id="id" value="{{ image_id }}" />
	<input type="hidden" name="image" id="image" value="{{ image_src }}" />
	<input type="hidden" name="crop_x" id="crop_x" value="0" />
	<input type="hidden" name="crop_y" id="crop_y" value="0" />
	<input type="hidden" name="crop_x2" id="crop_x2" value="0" />
	<input type="hidden" name="crop_y2" id="crop_y2" value="0" />
	<input type="hidden" id="crop_ratio" name="crop_ratio" value="{{crop_ratio}}" />
	<input type="hidden" id="crop_height" name="crop_height" value="{{crop_height}}" />
	<input type="hidden" id="crop_width" name="crop_width" value="{{crop_width}}" />
</form>
