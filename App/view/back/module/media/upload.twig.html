<div class="media">
	<div class="title">
		Gestion des médias
		<span class="pull-right">
			{% if noImage != true %}<a href="{{ siteUrl('module/' ~ mod.name ~ '/media') }}" class="link-popup btn btn-xs btn-success"><i class="fa fa-picture-o"></i> Voir les images</a>{% endif %}
			<a href="javascript:;" class="close-popup btn btn-xs btn-danger"><i class="fa fa-times"></i> Fermer</a>
		</span>
	</div>
	<div class="content">
		<div class="blocUpload">
			<input type="hidden" id="token" name="{{csrf_key}}" value="{{csrf_token}}" />
			<span class="btn btn-success fileinput-button" id="btn-upload">
				<i class="glyphicon glyphicon-plus"></i>
				<span>Sélectionner une image</span>
				<input type="file" name="files" id="fileupload" data-postaction="{{ siteUrl('module/' ~ mod.name ~ '/postupload') }}" data-url="{{ siteUrl('module/' ~ mod.name ~ '/upload') }}" />
			</span>
			<div class="loading">
				<div id="num">1 %</div>
				Upload en cours ...
			</div>
			<div class="progress" id="progress">
				<div class="progress-bar progress-bar-success"></div>
			</div>
		</div>
		<div class="postupload" id="postupload">
			<div class="loading">
				<span>
                    Traitement de l'image en cours ...<br />
                    Cette opération peut prendre plusieurs secondes en fonction de la taille de l'image source.
                </span>
				<img src="{{ asset('img/ajax-loader-medium.gif') }}" alt="" />
			</div>
		</div>
		<div class="files" id="files">
			<div class="progress-bar progress-bar-success"></div>
		</div>
	</div>
</div>
