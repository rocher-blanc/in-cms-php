<div id="deleteModal" class="modal-block modal-block-primary mfp-hide deleteModal">
	<section class="panel">
		<header class="panel-heading">
			<h2 class="panel-title">Confirmation</h2>
		</header>
		<div class="panel-body">
			<div class="modal-wrapper">
				<div class="modal-icon">
					<i class="fa fa-question-circle"></i>
				</div>
				<div class="modal-text">
					<h4>Suppression</h4>
					<p></p>
				</div>
			</div>
		</div>
		<form name="form" method="post" action="#" role="form" id="formDeleteModal">
			<input type="hidden" name="{{csrf_key}}" value="{{csrf_token}}" />
			<input type="hidden" id="id_hidden" name="id" value="" />
			<input type="hidden" name="_METHOD" value="DELETE"/>
			<footer class="panel-footer">
				<div class="row">
					<div class="col-md-12 text-right">
						<button class="btn btn-primary modal-confirm">Confirmer</button>
						<button class="btn btn-default modal-dismiss">Annuler</button>
					</div>
				</div>
			</footer>
		</form>
	</section>
</div>
