{% extends 'module.twig.html' %}

{% block title_page %}{{ _('langues')}}{% endblock %}
{% set this_page = 'Modification' %}
{% set title_block_page =  _('langue_edit_modif') %}

{% block module %}
<form name="form" method="post" action="{{ siteUrl('ext/langue/edit/' ~ id ) }}" role="form" class="form-horizontal group-border-dashed">
	<input type="hidden" name="{{csrf_key}}" value="{{csrf_token}}" />
	<div class="row">
		<div class="col-md-12">
			<section class="panel table ext">
				<header class="panel-heading">
					<h2 class="panel-title">{{ title_block_page }}</h2>
					<p class="panel-subtitle">{{ _('langue_edit_info')}}</p>
				</header>
				<div class="tab-content">
					<div class="tab-pane active panel-body">
						<div class="form-group">
							<label class="col-md-3 control-label">{{ _('nom')}}</label>
							<div class="col-md-6">
								<input type="text" id="lang_display" name="lang_display" class="form-control" value="{{ post.lang_display }}" />
							</div>
						</div>
						<div class="row">
							<div class="col-md-2">
								<a id="btn_back" href="{{ siteUrl('ext/langue') }}" class="btn btn-sm btn-warning"><i class="fa fa-arrow-left"></i> {{ _('retour_liste')}}</a>
							</div>

							<div class="col-md-5 col-md-offset-5 text-right">
								<button type="submit" id="btn_submit_stay" name="submit" value="stay" class="btn btn-sm btn-primary"><i class="fa fa-save"></i> {{ _('button_save_stay')}}</button>
								<button type="submit" id="btn_submit" name="submit" value="back" class="btn btn-sm btn-success"><i class="fa fa-save"></i> {{ _('button_save')}}</button>
							</div>
						</div>
					</div>
				</div>
			</section>
		</div>
	</div>
</form>
{% endblock %}
