<div class="menu popup">
    <div class="title">
        Ajout d'un élement
		<span class="pull-right">
			<a href="javascript:;" class="close-popup btn btn-xs btn-danger"><i class="fa fa-times"></i> Fermer</a>
		</span>
    </div>
    <div class="content">
        <form method="post" action="{{ siteUrl('ext/menu/element') }}/{{ id != -1 ? 'update' : 'add' }}" class="form-horizontal group-border-dashed" id="formElementMenu">
            <input type="hidden" id="idparent" name="idparent" value="{{idparent}}" />
            <input type="hidden" id="idmenu" name="idmenu" value="{{idmenu}}" />
            <input type="hidden" id="id" name="id" value="{{id}}" />
            <input type="hidden" id="token" name="{{csrf_key}}" value="{{csrf_token}}" />
            <div class="form-group" style="margin-left:0; margin-right:0;">
                <label class="col-md-3 control-label">Type</label>
                <div class="col-md-6">
                    <select name="type_element" id="id_type_element" data-plugin-selectTwo class="form-control">
                        {% if e.menu_element_type == '' %}<option value="nochoice" id="nochoice">-- Choisir --</option>{% endif %}
                        <option value="page"{{ e.menu_element_type == 'page' ? ' selected' : '' }}>Page spéciale</option>
                        <option value="module"{{ e.menu_element_type == 'module' ? ' selected' : '' }}>Module</option>
                        <option value="link"{{ e.menu_element_type == 'link' ? ' selected' : '' }}>Lien</option>
                        <option value="section"{{ e.menu_element_type == 'section' ? ' selected' : '' }}>Section</option>
                    </select>
                </div>
            </div>

            <div class="form-group niv1 {{ e.menu_element_type == 'page' ? '' : ' nodisplay' }}" id="cat_page">
                <label class="col-md-3 control-label">Page spéciale</label>
                <div class="col-md-6">
                    <select name="page_id" id="id_page_id" data-plugin-selectTwo class="form-control">
                        {% if e.menu_element_type != 'page' %}<option value="nochoice" id="p_nochoice">-- Choisir --</option>{% endif %}
                        {% for p in page %}
                        <option value="{{ p.page_id }}"{{ e.menu_element_value_id == p.page_id ? ' selected' : '' }}>{{ p.page_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group niv1{{ e.menu_element_type == 'module' ? '' : ' nodisplay' }}" id="cat_module">
                <label class="col-md-3 control-label">Module</label>
                <div class="col-md-6">
                    <select name="module_id" id="id_module_id" data-plugin-selectTwo class="form-control">
                        {% if e.menu_element_module_id == '' %}<option value="nochoice" id="m_nochoice">-- Choisir --</option>{% endif %}
                        {% for m in module %}
                        <option value="{{ m.module_id }}"{{ e.menu_element_module_id == m.module_id ? ' selected' : '' }}>{{ m.module_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group niv1{{ e.menu_element_type == 'link' ? '' : ' nodisplay' }}" id="cat_link">
                <label class="col-md-3 control-label">Lien</label>
                <div class="col-md-6">
                    <input type="text" id="link" name="link" class="form-control" value="{{ e.menu_element_link_href }}" />
                </div>
            </div>

            <div class="form-group niv2{{ e.menu_element_type == 'link' ? '' : ' nodisplay' }}" id="type_view_link">
                <label class="col-md-3 control-label">Le lien s'ouvre dans ?</label>
                <div class="col-md-6">
                    <select name="view_link" id="view_link" data-plugin-selectTwo class="form-control">
                        <option value="0"{{ e.menu_element_link_blank == 0 ? ' selected' : '' }}>Cette fenêtre</option>
                        <option value="1"{{ e.menu_element_link_blank == 1 ? ' selected' : '' }}>Une nouvelle fenêtre</option>
                    </select>
                </div>
            </div>

            <div class="form-group niv2{{ e.menu_element_type == 'module' ? '' : ' nodisplay' }}" id="type_view_module">
                <label class="col-md-3 control-label">Afficher</label>
                <div class="col-md-6">
                    <select name="module_option" id="module_option" data-plugin-selectTwo class="form-control">
                        {% if e.menu_element_option == '' %}<option value="nochoice" id="view_nochoice">-- Choisir --</option>{% endif %}
                        <option value="all"{{ e.menu_element_option == "all" ? ' selected' : '' }}>Tous les éléments</option>
                        <option value="one"{{ e.menu_element_option == "one" ? ' selected' : '' }}>Un élément</option>
                    </select>
                </div>
            </div>

            <div class="form-group niv3{{ e.menu_element_type == 'module' and e.menu_element_option == "all" ? '' : ' nodisplay' }}" id="type_view_submenu">
            <label class="col-md-3 control-label">Afficher dans un sous-menu ?</label>
            <div class="col-md-6">
                <select name="view_submenu" id="view_submenu" data-plugin-selectTwo class="form-control">
                    {% if e.menu_element_type == '' %}<option value="nochoice" id="submenu_nochoice">-- Choisir --</option>{% endif %}
                    <option value="yes"{{ e.menu_element_has_submenu == 1 ? ' selected' : '' }}>Oui</option>
                    <option value="no"{{ e.menu_element_has_submenu == 0 ? ' selected' : '' }}>Non</option>
                </select>
            </div>
    </div>

    <div class="form-group niv3{{ e.menu_element_type == 'module' and e.menu_element_has_submenu == 1 ? '' : ' nodisplay' }}" id="view_limit">
        <label class="col-md-3 control-label">Nombres de niveaux ?</label>
        <div class="col-md-6">
            <input type="text" id="level" name="level" class="form-control" value="{{ e.menu_element_type == 'module' ? e.menu_element_max_level : '0' }}" /> (0 = illimité)
        </div>
    </div>

    <div class="form-group niv3{{ e.menu_element_type == 'module' and e.menu_element_option == "one" ? '' : ' nodisplay"' }}" id="elm_module">
    <label class="col-md-3 control-label">Element</label>
    <div class="col-md-6">
        {% for m in module %}
            <div class="div_module_{{ m.module_id }} div_module" style="display:{% if e.menu_element_module_id == m.module_id %}block{% else %}none{% endif %};">
                <select name="module_{{ m.module_id }}" id="module_{{ m.module_id }}" data-plugin-selectTwo class="form-control selectmodule module_{{ m.module_id }}">
                    {% for e in m.content %}
                        <option value="{{ e.id }}">{{ e.url }}</option>
                    {% endfor %}
                </select>
            </div>
        {% endfor %}
    </div>
</div>

<div class="form-group niv2 niv3{{ e.menu_element_type != '' ? '' : ' nodisplay' }}" id="label">
    <label class="col-md-3 control-label">Label</label>
    <div class="col-md-6">
        {% for l in lang %}
        <div style="margin-bottom:10px;" class="input-group input-group-icon">
            <span class="input-group-addon">
                <span class="icon">
                    <i class="flag-icon flag-icon-{{ l.flag }}"></i>
                </span>
            </span>
            <input type="text" id="label_{{ l.url }}" name="label_{{ l.url }}" class="form-control" value="{{ label[ l.id ] }}" />
        </div>
        {% endfor %}
    </div>
</div>

<a class="btn btn-success btn-popup" id="valid" href="javascript:;"{{ e.menu_element_type != '' ? '' : ' style="display:none;"' }}>Valider</a>
</form>
</div>
</div>
