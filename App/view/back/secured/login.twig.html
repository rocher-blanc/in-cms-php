<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Identification - Administration</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="robots" content="noindex,nofollow" />
        <link rel="stylesheet" type="text/css" href="http://fonts.googleapis.com/css?family=Open+Sans:400,300" />
        <link rel="stylesheet" type="text/css" href="http://fonts.googleapis.com/css?family=Lato:400,700,300" />
        <link rel="stylesheet" href="{{ vendor('bootstrap/dist/css/bootstrap.min.css') }}" />
        <link rel="stylesheet" href="{{ vendor('bootstrap/dist/css/bootstrap-theme.min.css') }}" />
        <link rel="stylesheet" href="{{ asset('css/login.css') }}" />
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-xs-12">
                    <div class="main">
                        <div class="row">
                            <div class="col-xs-12 col-sm-6 col-sm-offset-1">
                                <h1>Administration</h1>
                                <h2>Interface de gestion de contenus pour votre site internet.</h2>

                                <form class="form-horizontal" action="{{ siteUrl('secured/login') }}" method="post">
                                    <input type="hidden" name="{{csrf_key}}" value="{{csrf_token}}" />

                                    <div class="form-group">
                                        <div class="col-md-8">
                                            <input type="text" name="username" class="form-control" placeholder="Idenfiant" required autofocus>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <div class="col-md-8">
                                            <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <div class="col-md-offset-0 col-md-8">
                                            <input class="btn btn-success btn btn-success" type="submit" value="Connexion"/>
                                        </div>
                                    </div>

                                </form>
                                <p class="credits">
                                    <strong>JWeb-CMS</strong> est une solution réalisée par <a href="http://www.jweb-creation.fr/?ref=loginBackOffice" title="Création de sites internet et e-commerce">JWeb-Création.fr</a>.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="{{ vendor('jquery/jquery.min.js') }}"></script>
        <script src="{{ vendor('bootstrap/dist/js/bootstrap.min.js') }}"></script>
    </body>
</html>
