<input type="hidden" name="{{ name }}" value="0" />
<div class="switch">
    <input id="id_{{ name }}" class="bt-switch" data-on-text="<i class='icon-line-check'></i>" data-off-text="<i class='icon-line-cross'></i>" data-on-color="themecolor" name="{{ name }}" value="1" type="checkbox"{{ value ? ' checked' : '' }}>
</div>
