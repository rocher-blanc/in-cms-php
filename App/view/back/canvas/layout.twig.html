<!DOCTYPE html>
<html dir="ltr" lang="en-US">

    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <meta name="author" content="SemiColonWeb" />
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="token" content="{{csrf_token}}" />
        <meta name="tokename" content="{{csrf_key}}" />
        {{ block('meta') }}

        <link href="https://fonts.googleapis.com/css?family=Lato:300,400,400i,700|Raleway:300,400,500,600,700|Crete+Round:400i" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" href="{{ asset('canvas/css/src/bootstrap.css') }}" type="text/css" />
        <link rel="stylesheet" href="{{ asset('canvas/css/src/style.css') }}" type="text/css" />
        <link rel="stylesheet" href="{{ asset('canvas/css/src/font-icons.css') }}" type="text/css" />
        <link rel="stylesheet" href="{{ asset('canvas/css/src/animate.css') }}" type="text/css" />
        <link rel="stylesheet" href="{{ asset('canvas/css/src/magnific-popup.css') }}" type="text/css" />
        <link rel="icon" type="image/png" href="{% include 'favicon.twig.html' %}" />

        {{ block('stylesheets') }}
        <title>{% block title %}Administration{% endblock %}</title>
        <script src="{{ asset('js/init.js') }}"></script>
        <script>
            var siteurl = site + '/{{ adminFolder }}/' ;
        </script>
        {{ block('javascript_head') }}
    </head>
    <body class="stretched">
        {{ block('contenu') }}

        <div id="gotoTop" class="icon-angle-up"></div>

        <script src="{{ asset('canvas/js/jquery.js') }}"></script>
        <script src="{{ asset('canvas/js/plugins.js') }}"></script>
        <script src="{{ asset('canvas/js/functions.js') }}"></script>
        <script src="{{ asset('canvas/js/easydoor/common.js') }}"></script>
        {% if (flash.__result == true or flash.__result == false) and flash.__msg != '' %}
            <script>
                Notify("{{flash.__msg}}", {{flash.__result == true ? 'true' : 'false' }});
            </script>
        {% endif %}
        {{ block('javascripts') }}
        {{ block('javascripts_end') }}
    </body>
</html>
