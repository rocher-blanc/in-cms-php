<div class="row">
	<div class="col-md-12">
		<div class="edit">
			<div class="tabs">
				<ul class="nav nav-tabs nav-justified text-right tabs-primary tab-module">
					<li>
						<a href="{{ siteUrl('/module/' ~ mod.name ) }}">Liste</a>
					</li>
					<li{% if action == 'edit' %} class="active"{% endif %}>
						<a href="{{ siteUrl('/module/' ~ mod.name ~ '/edit/' ~ id) }}">Général</a>
					</li>
					{% if seo == true %}
					<li{% if action == 'seo' %} class="active"{% endif %}>
						<a href="{{ siteUrl('/module/' ~ mod.name ~ '/seo/' ~ id) }}">Référencement</a>
					</li>
					{% endif %}
				</ul>
			</div>
		</div>
		<div class="tab-d">
			<div class="tab-pane active panel-body cadre-module">
				{% include 'module/edit.form.twig.html' with field %}
				<div class="row">
					<div class="col-md-2">
						<a id="btn_back" href="{{ siteUrl('/module/' ~ mod.name ) }}" class="btn btn-sm btn-warning"><i class="fa fa-arrow-left"></i> Retourner à la liste</a>
					</div>
					<div class="col-md-5 col-md-offset-5 text-right">
						<button type="submit" id="btn_submit_stay" name="submit" value="stay" class="btn btn-sm btn-primary"><i class="fa fa-save"></i> Enregistrer et continuer l'édition</button>
						<button type="submit" id="btn_submit" name="submit" value="back" class="btn btn-sm btn-success"><i class="fa fa-save"></i> Enregistrer</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
